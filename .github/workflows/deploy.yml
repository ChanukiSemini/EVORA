name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Triggers the pipeline on every push to the main branch
  pull_request:
    branches: [ "main" ] # Triggers the pipeline for pull requests targeting main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm ci # Efficiently installs dependencies listed in package-lock.json

    - name: Build Application Assets
      run: npm run build # This triggers Vite to look at 'ReviewSection' and build into 'dist'

    - name: Upload Production Artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist' # Uploads the compiled assets from your root dist folder

    - name: Deploy Compiled Site to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: deployment
      uses: actions/deploy-pages@v4